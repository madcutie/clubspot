services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clubspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubspot}
    ports:
      # 5433 on the host: 5432 is taken by another project's postgres that auto-starts with Docker
      - "${CLUBSPOT_PG_PORT:-5433}:5432"
    volumes:
      - clubspot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clubspot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clubspot-postgres:
