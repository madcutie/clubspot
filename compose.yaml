services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clubspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubspot}
    ports:
      # Standard port. If another project's postgres holds 5432, override with CLUBSPOT_PG_PORT.
      - "${CLUBSPOT_PG_PORT:-5432}:5432"
    volumes:
      - clubspot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clubspot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clubspot-postgres:
